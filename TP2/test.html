<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Spritesheets</title>
  <style>
    body {
      background: #1e293b;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 40px;
      height: 100vh;
      margin: 0;
    }

    .superman {
      width: 120px;  
      height: 90px;
      background-image: url('/TP2/Assets/superman/volando.png');
      background-repeat: no-repeat;
      background-size: 600px 90px;
      animation: volar 0.65s steps(5) infinite;
    }

    .superman.chocado {
        animation: 
            volar 0.65s steps(5) infinite,
            titilar-dano 0.15s steps(2) infinite;
    }

    .superman.chocado-edificio {
        animation: 
            volar 0.45s steps(5) infinite,
            golpe-edificio 0.7s ease-in-out infinite; /* En el juego real sacale el 'infinite' */
    }

    .superman.curado {
        animation: 
            volar 0.45s steps(5) infinite,
            curar-brillo 0.8s ease-in-out infinite;
    }

    .superman.muerto {
        animation: 
            volar 0.45s steps(5) infinite,
            caer-derrotado 1.2s ease-in infinite; 
    }

    .corazon {
        width: 100px;
        height: 90px;
        background-image: url('/TP2/Assets/superman/corazon.png'); 
        background-repeat: no-repeat;
        background-size: 600px 90px;
        image-rendering: pixelated;
        animation: 
            girar-corazon 0.6s steps(6) infinite,
            flotar-corazon 1s ease-in-out infinite alternate;
    }

    .meteorito {
      width: 120px;  
      height: 90px;
      background-image: url('/TP2/Assets/superman/meteoritoverde.png');
      background-repeat: no-repeat;
      background-size: 600px 90px;
      animation: volar 0.65s steps(5) infinite;
    }

    .meteorito2 {
      width: 150px;  
      height: 90px;
      background-image: url('/TP2/Assets/superman/meteorito.png');
      background-repeat: no-repeat;
      background-size: 600px 90px;
      animation: volar 0.65s steps(4) infinite;
    }

    @keyframes volar {
        0% { background-position: 0px 0px; }
        100% { background-position: -600px 0px; }
    }

    @keyframes titilar-dano {
        0% {
            opacity: 1;
            filter: none;
        }
        50% {
            opacity: 0.25;
            filter: hue-rotate(95deg) saturate(2.5) brightness(1.3);
        }
    }

    @keyframes girar-corazon {
        0% { background-position: 0px 0px; }
        100% { background-position: -600px 0px; }
    }

    @keyframes flotar-corazon {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-14px); }
    }

    @keyframes curar-brillo {
        0% {
            transform: scale(1);
            filter: brightness(1);
        }
        50% {
            transform: scale(1.18);
            filter: brightness(1.8) drop-shadow(0 0 10px #facc15);
        }
        100% {
            transform: scale(1);
            filter: brightness(1);
        }
    }

    @keyframes caer-derrotado {
        0% {
            transform: translateY(0px) rotate(0deg);
            filter: none;
            opacity: 1;
        }
        25% {
            /* Pequeño salto hacia atrás por el golpe final y se pone pálido/gris */
            transform: translateY(-25px) rotate(-20deg);
            filter: grayscale(0.8) brightness(0.8);
            opacity: 1;
        }
        100% {
            /* Cae en picada hacia el suelo girando hacia abajo */
            transform: translateY(250px) rotate(85deg);
            filter: grayscale(1) brightness(0.6);
            opacity: 0;
        }
    }

    @keyframes golpe-edificio {
        0% {
            transform: translate(0, 0) rotate(0deg);
            filter: none;
        }
        20% {
            /* Retroceso brusco hacia atrás con destello blanco de impacto */
            transform: translate(-15px, -6px) rotate(-18deg);
            filter: brightness(2.5);
        }
        45% {
            /* Rebote hacia adelante con tinte rojo de daño */
            transform: translate(8px, 5px) rotate(12deg);
            filter: sepia(1) hue-rotate(-50deg) saturate(4) brightness(1.2);
        }
        70% {
            transform: translate(-6px, -2px) rotate(-8deg);
            filter: brightness(1.8);
        }
        100% {
            transform: translate(0, 0) rotate(0deg);
            filter: none;
        }
    }
  </style>
</head>
<body>
    <div class="superman"></div>
    <div class="superman chocado"></div>
    <div class="superman chocado-edificio"></div>
    <div class="superman curado"></div>
    <div class="superman muerto"></div>
    <div class="corazon"></div>
    <div class="meteorito"></div>
    <div class="meteorito2"></div>
</body>
</html>
