<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Prueba Spritesheets</title>
  <style>
    body {
      background: #1e293b;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 40px;
      height: 100vh;
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    .escenario {
      width: 320px;
      height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px dashed rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }

    .superman {
      width: 120px;  
      height: 90px;
      background-image: url('/TP2/Assets/superman/volando.png');
      background-repeat: no-repeat;
      background-size: 600px 90px;
      animation: volar 0.65s steps(5) infinite;
    }

    .superman.impulso {
      animation: 
        volar 0.65s steps(5) infinite,
        cabeceo-impulso 0.45s ease-out;
    }

    .superman.chocado {
      animation: 
        volar 0.65s steps(5) infinite,
        titilar-dano 0.15s steps(2) infinite;
    }

    .superman.chocado-edificio {
      animation: 
        volar 0.65s steps(5) infinite,
        golpe-edificio 1.1s ease-in-out;
    }

    .superman.curado {
      animation: 
        volar 0.65s steps(5) infinite,
        curar-brillo 0.4s ease-in-out 3;
    }

    .superman.muerto {
      animation: 
        volar 0.65s steps(5) infinite,
        caer-derrotado 1.2s ease-in forwards; 
    }

    .corazon {
      width: 100px;
      height: 90px;
      background-image: url('/TP2/Assets/superman/corazon.png'); 
      background-repeat: no-repeat;
      background-size: 600px 90px;
      image-rendering: pixelated;
      animation: 
        girar-corazon 0.6s steps(6) infinite,
        flotar-corazon 1s ease-in-out infinite alternate;
    }

    .meteorito {
      width: 120px;  
      height: 90px;
      background-image: url('/TP2/Assets/superman/meteoritoverde.png');
      background-repeat: no-repeat;
      background-size: 600px 90px;
      animation: volar 0.65s steps(5) infinite;
    }

    .meteorito2 {
      width: 150px;  
      height: 90px;
      background-image: url('/TP2/Assets/superman/meteorito.png');
      background-repeat: no-repeat;
      background-size: 600px 90px;
      animation: volar 0.65s steps(4) infinite;
    }

    /* Botonera de pruebas */
    .controles {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 600px;
    }

    button {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s;
    }

    button:active { transform: scale(0.96); }

    .btn-impulso    { background: #a855f7; color: white; }
    .btn-kriptonita { background: #22c55e; color: #052e16; }
    .btn-edificio   { background: #ef4444; color: white; }
    .btn-vida       { background: #facc15; color: #422006; }
    .btn-gameover   { background: #64748b; color: white; }
    .btn-reset      { background: #38bdf8; color: #082f49; }

    /* Keyframes */
    @keyframes volar {
      0% { background-position: 0px 0px; }
      100% { background-position: -600px 0px; }
    }

    @keyframes cabeceo-impulso {
      0% {
        transform: translateY(0px) rotate(0deg);
      }
      35% {
        transform: translateY(-15px) rotate(-15deg);
      }
      100% {
        transform: translateY(0px) rotate(0deg);
      }
    }

    @keyframes titilar-dano {
      0% {
        opacity: 1;
        filter: none;
      }
      50% {
        opacity: 0.25;
        filter: hue-rotate(95deg) saturate(2.5) brightness(1.3);
      }
    }

    @keyframes girar-corazon {
      0% { background-position: 0px 0px; }
      100% { background-position: -600px 0px; }
    }

    @keyframes flotar-corazon {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-14px); }
    }

    @keyframes curar-brillo {
      0% {
        transform: scale(1);
        filter: brightness(1);
      }
      50% {
        transform: scale(1.1);
        filter: brightness(1.8) drop-shadow(0 0 10px #facc15);
      }
      100% {
        transform: scale(1);
        filter: brightness(1);
      }
    }

    @keyframes caer-derrotado {
      0% {
        transform: translateY(0px) rotate(0deg);
        filter: none;
        opacity: 1;
      }
      25% {
        transform: translateY(-25px) rotate(-20deg);
        filter: grayscale(0.8) brightness(0.8);
        opacity: 1;
      }
      100% {
        transform: translateY(250px) rotate(85deg);
        filter: grayscale(1) brightness(0.6);
        opacity: 0;
      }
    }

    @keyframes golpe-edificio {
      0% {
        transform: translate(0, 0) rotate(0deg);
        filter: none;
      }
      15% {
        transform: translate(-15px, -6px) rotate(-18deg);
        filter: brightness(2.5);
      }
      35% {
        transform: translate(8px, 5px) rotate(12deg);
        filter: sepia(1) hue-rotate(-50deg) saturate(5) brightness(1.2);
      }
      55% {
        transform: translate(-10px, -4px) rotate(-12deg);
        filter: brightness(2.2);
      }
      75% {
        transform: translate(5px, 3px) rotate(6deg);
        filter: sepia(1) hue-rotate(-50deg) saturate(5) brightness(1.2);
      }
      90% {
        transform: translate(-3px, -1px) rotate(-3deg);
        filter: sepia(1) hue-rotate(-50deg) saturate(3) brightness(1.1);
      }
      100% {
        transform: translate(0, 0) rotate(0deg);
        filter: none;
      }
    }
  </style>
</head>
<body>

  <div class="escenario">
    <div id="superman" class="superman"></div>
  </div>

  <div class="controles">
    <button class="btn-impulso" onclick="activarAnimacion('impulso', 450)">Impulso (Espacio)</button>
    <button class="btn-kriptonita" onclick="activarAnimacion('chocado', 1200)">Choque Kriptonita</button>
    <button class="btn-edificio" onclick="activarAnimacion('chocado-edificio', 1100)">Choque Edificio</button>
    <button class="btn-vida" onclick="activarAnimacion('curado', 1600)">Agarrar Vida</button>
    <button class="btn-gameover" onclick="activarGameOver()">Game Over</button>
    <button class="btn-reset" onclick="resetearVuelo()">Volver a Volar</button>
  </div>

  <script>
    const superman = document.getElementById('superman');
    let temporizador = null;

    function limpiarEstados() {
      clearTimeout(temporizador);
      superman.classList.remove('impulso', 'chocado', 'chocado-edificio', 'curado', 'muerto');
      void superman.offsetWidth;
    }

    function activarAnimacion(clase, duracionMs) {
      limpiarEstados();
      superman.classList.add(clase);

      temporizador = setTimeout(() => {
        superman.classList.remove(clase);
      }, duracionMs);
    }

    function activarGameOver() {
      limpiarEstados();
      superman.classList.add('muerto');
    }

    function resetearVuelo() {
      limpiarEstados();
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        activarAnimacion('impulso', 450);
      }
    });
  </script>

</body>
</html>
