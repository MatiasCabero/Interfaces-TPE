<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · M&M Arcade</title>

  <!-- Todo el CSS vive ahora en un archivo aparte -->
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <!-- =========================================================
       FONDO DECORATIVO (collage de imágenes en movimiento)
       Es puramente visual, no aporta información, por eso va
       con aria-hidden="true": los lectores de pantalla lo saltean.
       ========================================================= -->
  <div class="background-wrapper" aria-hidden="true">
    <div class="background-grid">
      <!-- Cada fila tiene 5 "tiles" + las mismas 5 repetidas al lado
           (10 columnas en total). Así, al desplazar la grilla -50%
           en X, la segunda mitad calza exacto con la primera y el
           loop horizontal no se nota.
           (Reemplazá cada .tile por una <img> real si querés usar
           tus propias capturas de juegos como fondo). -->
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>

      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>

      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>

      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>

      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>

      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
      <div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div><div class="tile"></div>
    </div>
  </div>
  <!-- Capa oscura encima del collage para que la tarjeta resalte -->
  <div class="background-overlay" aria-hidden="true"></div>

  <!-- =========================================================
       CONTENIDO PRINCIPAL: la tarjeta de login.
       Es el único <main> de la página (regla: debe haber uno solo).
       ========================================================= -->
  <main class="login-card">
    <h1 class="login-title">Iniciar sesión</h1>

    <!-- Grupo 1: login con redes sociales.
         <section> agrupa contenido relacionado; le damos un título
         accesible con aria-labelledby aunque no se vea en pantalla,
         para que quien navegue con lector de pantalla entienda
         qué hace este bloque de botones. -->
    <section aria-labelledby="social-login-heading">
      <h2 id="social-login-heading" class="visually-hidden">
        Iniciar sesión con una red social
      </h2>

      <div class="social-buttons">
        <button type="button" class="social-btn">
          <!-- Logo de Google (4 colores oficiales) -->
          <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20.5H24v7h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5-5C33.6 6.1 29.1 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l5.8 4.3C13.7 15.4 18.5 12 24 12c3.1 0 5.9 1.2 8 3.1l5-5C33.6 6.1 29.1 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5 0 9.5-1.9 12.9-5l-6-4.9C29 35.6 26.6 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-5.9 4.5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20.5H24v7h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6 4.9C40.9 35 44 29.9 44 24c0-1.2-.1-2.4-.4-3.5z"/>
          </svg>
          Iniciar sesión con Google
        </button>

        <button type="button" class="social-btn">
          <!-- Logo de Facebook -->
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="12" fill="#1877F2"/>
            <path fill="#ffffff" d="M15.1 12.3h-2.1V19h-2.9v-6.7H8.6V9.9h1.5V8.4c0-1.7.9-3.1 3.2-3.1h2v2.6h-1.4c-.4 0-.8.3-.8.8v1.2h2.2l-.2 2.4z"/>
          </svg>
          Iniciar sesión con Facebook
        </button>

        <button type="button" class="social-btn">
          <!-- Logo de Apple -->
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#000000" d="M16.3 12.6c0-2 1.6-3 1.7-3.1-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.7-3.1.7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.5 2.1 2.6 2 1-.1 1.4-.7 2.7-.7 1.3 0 1.6.7 2.7.6 1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.2-.8-2.3-3zM14.4 6.4c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 2-.5 2.5-1.2z"/>
          </svg>
          Iniciar sesión con Apple
        </button>
      </div>
    </section>

    <!-- Separador visual y semántico entre las dos formas de login.
         <hr> es el elemento correcto en HTML para marcar un cambio
         de tema/sección dentro de un mismo bloque de contenido. -->
    <hr class="divider">

    <!-- Grupo 2: formulario tradicional (usuario + contraseña) -->
    <section aria-labelledby="form-login-heading">
      <h2 id="form-login-heading" class="visually-hidden">
        Iniciar sesión con usuario y contraseña
      </h2>

      <form action="#" method="post">
        <div class="form-group">
          <label for="usuario">Ingrese su usuario o email</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">Ingrese su contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-submit">Iniciar sesión</button>
      </form>
    </section>

    <p class="signup-text">¿Aún no tenes cuenta? <a href="#">Regístrate aca</a></p>
  </main>

</body>
</html>
