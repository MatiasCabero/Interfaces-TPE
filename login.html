<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · M&M Arcade</title>

  <!-- Fuente pixelada/retro para el título -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <!-- FONDO DECORATIVO ANIMADO (5 elementos por fila) -->
  <div class="background-wrapper" aria-hidden="true">
    <div class="bg-row">
      <div class="tile"><img src="Assets/Apex Legends.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Assassin's Creed.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Assetto Corsa.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/The Legend of Zelda.avif" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/God of War.webp" alt="" class="tile-img"></div>
    </div>
    <div class="bg-row">
      <div class="tile"><img src="Assets/Mario Kart 8 Deluxe.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/The Crew Motorfest.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Need for Speed Most Wanted.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Call of Duty.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Counter-Strike 2.webp" alt="" class="tile-img"></div>
    </div>
    <div class="bg-row">
      <div class="tile"><img src="Assets/Cyberpunk 2077.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Tomb Raider.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/uncharted.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Need for Speed Most Wanted.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Red Dead Redemption 2.webp" alt="" class="tile-img"></div>
    </div>
    <div class="bg-row">
      <div class="tile"><img src="Assets/DOOM Eternal.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/The Last of Us.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Baldur's Gate 3.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Battlefield 1.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Burnout Paradise Remastered.jpeg" alt="" class="tile-img"></div>
    </div>
    <div class="bg-row">
      <div class="tile"><img src="Assets/Valorant.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Final Fantasy VII Rebirth.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Persona 5 Royal.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/peg_solitaire.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Diablo IV.jpeg" alt="" class="tile-img"></div>
    </div>
    <div class="bg-row">
      <div class="tile"><img src="Assets/Dirt Rally.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Gran Turismo.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Baldur's Gate 3.jpeg" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Ghost of Tsushima.webp" alt="" class="tile-img"></div>
      <div class="tile"><img src="Assets/Titanfall 2.webp" alt="" class="tile-img"></div>
    </div>
  </div>

  <div class="background-overlay" aria-hidden="true"></div>

  <!-- TARJETA PRINCIPAL DE LOGIN -->
  <main class="login-card">
    <h1 class="login-title">Iniciar sesión</h1>

    <section aria-labelledby="social-login-heading">
      <h2 id="social-login-heading" class="visually-hidden">
        Iniciar sesión con una red social
      </h2>

      <div class="social-buttons">
        <button type="button" class="social-btn">
          <svg class="icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20.5H24v7h11.3c-1.6 4.6-6 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5-5C33.6 6.1 29.1 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.2-.1-2.4-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l5.8 4.3C13.7 15.4 18.5 12 24 12c3.1 0 5.9 1.2 8 3.1l5-5C33.6 6.1 29.1 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5 0 9.5-1.9 12.9-5l-6-4.9C29 35.6 26.6 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-5.9 4.5C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20.5H24v7h11.3c-.8 2.2-2.2 4.1-4.1 5.5l6 4.9C40.9 35 44 29.9 44 24c0-1.2-.1-2.4-.4-3.5z"/>
          </svg>
          Iniciar sesión con Google
        </button>

        <button type="button" class="social-btn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="12" fill="#1877F2"/>
            <path fill="#ffffff" d="M15.1 12.3h-2.1V19h-2.9v-6.7H8.6V9.9h1.5V8.4c0-1.7.9-3.1 3.2-3.1h2v2.6h-1.4c-.4 0-.8.3-.8.8v1.2h2.2l-.2 2.4z"/>
          </svg>
          Iniciar sesión con Facebook
        </button>

        <button type="button" class="social-btn">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#000000" d="M16.3 12.6c0-2 1.6-3 1.7-3.1-1-1.4-2.5-1.6-3-1.6-1.3-.1-2.5.7-3.1.7-.6 0-1.6-.7-2.6-.7-1.3 0-2.6.8-3.3 2-1.4 2.4-.4 6 1 8 .7 1 1.5 2.1 2.6 2 1-.1 1.4-.7 2.7-.7 1.3 0 1.6.7 2.7.6 1.1 0 1.8-1 2.5-2 .8-1.1 1.1-2.2 1.1-2.3-.1 0-2.2-.8-2.3-3zM14.4 6.4c.6-.7 1-1.7.9-2.7-.9 0-1.9.6-2.5 1.3-.5.6-1 1.6-.9 2.6 1 .1 2-.5 2.5-1.2z"/>
          </svg>
          Iniciar sesión con Apple
        </button>
      </div>
    </section>

    <hr class="divider">

    <section aria-labelledby="form-login-heading">
      <h2 id="form-login-heading" class="visually-hidden">
        Iniciar sesión con usuario y contraseña
      </h2>

      <form action="#" method="post" class="login-form">
        <div class="form-group">
          <label for="usuario">Ingrese su usuario o email</label>
          <input type="text" id="usuario" name="usuario" autocomplete="username" required>
        </div>

        <div class="form-group">
          <label for="password">Ingrese su contraseña</label>
          <input type="password" id="password" name="password" autocomplete="current-password" required>
        </div>

        <button type="submit" class="btn-submit" id="btnSubmit">
          <span class="btn-text">Iniciar sesión</span>
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-check" aria-hidden="true">✓</span>
        </button>

        <p id="login-status" class="login-status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <p class="signup-text">¿Aún no tenes cuenta? <a href="register.html">Regístrate aca</a></p>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
